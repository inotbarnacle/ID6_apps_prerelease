name: Head-unit storage evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Metadata, legacy reads, split-node routing and privacy
        run: python3 -B source/tools/test_capture_headunit.py
