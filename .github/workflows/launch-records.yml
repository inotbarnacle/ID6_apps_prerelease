name: LaunchDeck record reads

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native regressions and real failing stdio streams
        run: make -C source/native test CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
      - name: Production syntax and static analysis
        run: |
          ${{ matrix.cxx }} -std=gnu++98 -Wall -Wextra -Werror -Isource/native/sdk -Isource/native/src/common -Isource/native/src/ipc -fsyntax-only source/native/src/plugins/launch_deck.cpp
          clang++ --analyze -Xanalyzer -analyzer-output=text -std=gnu++98 -Isource/native/sdk -Isource/native/src/common -Isource/native/src/ipc source/native/src/plugins/launch_deck.cpp
      - uses: actions/checkout@v4
        with:
          repository: inotbarnacle/iDriveDeck
          ref: 8567abaadd1305965b3ad39e3222575cd49c507d
          path: baseline
      - name: Prove the read-error fixture fails against the pinned upstream loader
        run: |
          ${{ matrix.cxx }} -std=gnu++98 -Wall -Wextra -Werror -Ibaseline/source/native/src/common -Isource/native/src/common source/native/tests/test_launch_record_io.cpp source/native/build/launch_timer.o -o source/native/build/test-launch-record-io-baseline
          if source/native/build/test-launch-record-io-baseline > source/native/build/record-baseline.log 2>&1; then
            cat source/native/build/record-baseline.log
            exit 1
          fi
          cat source/native/build/record-baseline.log
          rg -F 'partial=0 errors=2 closes=1' source/native/build/record-baseline.log
  memory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: File compatibility and read errors under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: make -C source/native test-launch-records CC=clang CXX=clang++ CFLAGS='-O1 -g -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer' CXXFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
