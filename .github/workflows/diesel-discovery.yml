name: Diesel discovery tool

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate offline plan and privacy-safe reports
        run: |
          python3 -B source/tools/discover_diesel.py --plan
          python3 -B source/tools/discover_diesel.py --plan --profile standard-egt
          python3 -B source/tools/discover_diesel.py --plan --profile standard-diesel
          python3 -B source/tools/discover_diesel.py --plan --profile standard-pressure
          python3 -B source/tools/discover_diesel.py --plan --profile standard-dpf
          python3 -B source/tools/discover_diesel.py --plan --profile standard-aftertreatment
          python3 -B source/tools/test_discover_diesel.py
          python3 -B source/tools/test_probe_signals.py
          python3 -B source/tools/test_capture_headunit.py
